[project]
name = "chimera-template"
version = "0.1.0"
description = "Template for chimera plugins"
license = "GPL-2.0-or-later"
authors = [
    { name = "William Schoenell", email = "wschoenell@gmail.com" },
    { name = "Paulo Henrique Silva", email = "ph.silva@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chimera",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "cookiecutter>=2.6",
    "tomli>=2.0; python_version<'3.11'",
    "build>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimera_template"]
[tool.ruff.lint]
select = ["N802", "N803"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)# SPDX-FileCopyrightText:\\s\\d{4}(-(\\d{4}|present))*"


[tool.uv.sources]
chimera = { path = "../chimera" }

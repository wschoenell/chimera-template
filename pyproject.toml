[project]
name = "chimera-template"
version = "0.1.0"
description = "Cookiecutter template for chimera plugins"
license = "GPL-2.0-or-later"
authors = [
    { name = "William Schoenell", email = "wschoenell@gmail.com" },
    { name = "Paulo Henrique Silva", email = "ph.silva@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cookiecutter>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "cookiecutter>=2.6",
    "build>=1.0",
]

[tool.ruff.lint]
select = ["N802", "N803"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)# SPDX-FileCopyrightText:\\s\\d{4}(-(\\d{4}|present))*"

name: Test Cookiecutter Template

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv pip install --system pytest cookiecutter tomli build

      - name: Run tests
        run: |
          pytest tests/ -v

      - name: Test cookiecutter generation
        run: |
          cookiecutter . --no-input --output-dir /tmp/test-output
          ls -la /tmp/test-output/chimera-my-chimera-plugin
